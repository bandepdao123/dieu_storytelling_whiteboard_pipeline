[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "du-storytelling-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
du-pipeline = "du_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
